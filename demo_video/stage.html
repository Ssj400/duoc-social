<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>educadex showcase</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0d0820;font-family:"Noto Sans","Inter",system-ui,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;perspective:2200px;perspective-origin:50% 50%;
 background:radial-gradient(900px 600px at 25% 20%,rgba(139,92,246,.35),transparent 60%),radial-gradient(900px 700px at 80% 85%,rgba(217,70,239,.22),transparent 60%),linear-gradient(135deg,#150a33 0%,#0b0620 55%,#1a0b3d 100%)}
#cam{position:absolute;left:960px;top:540px;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.dev{position:absolute;transform-style:preserve-3d}
#laptop{left:-810px;top:-330px;width:960px}
#lscreen{width:960px;height:600px;border-radius:20px 20px 6px 6px;background:#0a0814;padding:14px;border:2px solid #2b2540;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 80px rgba(139,92,246,.25)}
#lscreen .in{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#000}
#lbase{position:relative;left:-60px;width:1080px;height:20px;margin-top:-1px;border-radius:0 0 40px 40px;background:linear-gradient(#3a3452,#1b1730);box-shadow:0 30px 60px rgba(0,0,0,.55)}
#lbase::after{content:"";position:absolute;left:50%;top:0;width:160px;height:7px;margin-left:-80px;border-radius:0 0 10px 10px;background:#0f0c1d}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#phone{left:436px;top:-338px;width:328px;height:676px;border-radius:44px;background:#0a0814;border:3px solid #2b2540;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 80px rgba(217,70,239,.25)}
#phone .in{position:relative;width:100%;height:100%;border-radius:33px;overflow:hidden;background:#000}
#notch{position:absolute;left:50%;top:10px;width:84px;height:20px;margin-left:-42px;border-radius:12px;background:#05040b;z-index:3}
#label{position:absolute;left:28px;bottom:16px;font-size:20px;color:rgba(255,255,255,.75);letter-spacing:.02em;z-index:20}
#cap{position:absolute;left:0;right:0;bottom:62px;display:flex;justify-content:center;z-index:15;pointer-events:none}
#cap div{position:absolute;bottom:0;max-width:1560px;padding:16px 38px;border-radius:999px;background:rgba(12,6,32,.88);border:2px solid rgba(196,181,253,.5);color:#fff;font-size:42px;font-weight:600;line-height:1.2;text-align:center;opacity:0;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;z-index:10;opacity:0}
#intro{background:rgba(11,6,32,.72)}
#end{background:rgba(11,6,32,.8)}
.card h1{font-size:150px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(90deg,#c4b5fd,#f0abfc);-webkit-background-clip:text;color:transparent;padding-bottom:10px}
.card p{font-size:50px;font-weight:500;max-width:1400px;line-height:1.25}
.card h2{font-size:84px;font-weight:800;letter-spacing:-.01em}
.card small{display:block;margin-top:34px;font-size:28px;color:rgba(255,255,255,.8);max-width:1400px;line-height:1.35}
</style></head><body>
<div id="stage">
 <div id="cam">
  <div class="dev" id="laptop"><div id="lscreen"><div class="in"><video id="vTutor" src="escritorio_tutor.mp4" muted playsinline preload="auto"></video><video id="vCaso" src="escritorio_caso.mp4" muted playsinline preload="auto"></video></div></div><div id="lbase"></div></div>
  <div class="dev" id="phone"><div id="notch"></div><div class="in"><video id="vMov" src="movil_estudiante.mp4" muted playsinline preload="auto"></video></div></div>
 </div>
 <div id="cap"></div>
 <div class="card" id="intro"><h1>educadex</h1><p>Vive tus próximos semestres antes de llegar a ellos</p></div>
 <div class="card" id="end"><h2>Sin puntajes · Sin perfiles · Tú decides</h2><small>Ingeniería en Informática mención Desarrollo de Software · malla pública Duoc UC · demo con datos ficticios</small></div>
 <div id="label">Demo · datos ficticios</div>
</div>
<script>
const TOTAL=78.5, R=1.25;
const $=id=>document.getElementById(id);
// camera: perspective-friendly transform list (same functions in each key)
const cs=(s,cx,cy,ry,rx)=>`rotateX(${rx}deg) rotateY(${ry}deg) scale(${s}) translate3d(${-cx}px,${-cy}px,0)`;
const K=[[0,cs(.88,135,0,-10,3)],[3.3,cs(.95,-330,10,-6,2)],[4.5,cs(1.2,-330,22,-5,1.5)],[19,cs(1.2,-330,22,2,0)],[21.2,cs(1.2,600,30,6,0)],[61.2,cs(1.2,600,30,-3,0)],[63.4,cs(.95,135,0,-4,2)],[74.2,cs(.95,135,0,4,1)],[TOTAL,cs(.9,135,0,10,3)]];
const mk=(arr,fmt)=>arr.map(([t,v],i)=>({offset:t/TOTAL,...fmt(v),easing:'cubic-bezier(.45,.05,.3,1)'}));
$('cam').animate(mk(K,v=>({transform:v})),{duration:TOTAL*1000,fill:'both'});
const fade=(el,pts)=>el.animate(pts.map(([t,o])=>({offset:t/TOTAL,opacity:o})),{duration:TOTAL*1000,fill:'both'});
fade($('intro'),[[0,1],[3,1],[3.6,0],[TOTAL,0]]);
fade($('end'),[[0,0],[74.2,0],[74.9,1],[TOTAL,1]]);
// laptop video crossfade
fade($('vTutor'),[[0,1],[61.5,1],[62.2,0],[TOTAL,0]]);
fade($('vCaso'),[[0,0],[61.5,0],[62.2,1],[TOTAL,1]]);
// devices dim under end card
fade($('laptop'),[[0,1],[74.2,1],[75,.35],[TOTAL,.35]]);
fade($('phone'),[[0,1],[74.2,1],[75,.35],[TOTAL,.35]]);
const caps=[["El tutor escribe su experiencia; la IA propone una escena; el tutor decide si se publica",4.3,20],
["El estudiante juega situaciones reales de su malla",21.6,29],
["Marca qué le sorprendió; no hay respuestas correctas",29.2,43],
["La IA propone brechas; el estudiante confirma y decide qué compartir",43.2,61],
["El tutor ve solo lo compartido y acuerda un siguiente paso",63,74]];
caps.forEach(([txt,a,b])=>{const d=document.createElement('div');d.textContent=txt;$('cap').appendChild(d);
 d.animate([{offset:0,opacity:0},{offset:a/TOTAL,opacity:0},{offset:(a+.5)/TOTAL,opacity:1},{offset:(b-.4)/TOTAL,opacity:1},{offset:b/TOTAL,opacity:0},{offset:1,opacity:0}],{duration:TOTAL*1000,fill:'both'})});
// clip time mapping (speed 1.25x; caso starts at clip 3s)
window.TOTAL=TOTAL;
window.clipMap=T=>({vTutor:Math.max(0,(T-3.5)*R+0.2),vMov:Math.max(0,(T-21)*R),vCaso:3+Math.max(0,(T-62))*R});
window.seekAll=async T=>{const m=clipMap(T);
 await Promise.all(Object.entries(m).map(([id,t])=>{const v=$(id);t=Math.min(t,v.duration-0.05);
  if(Math.abs(v.currentTime-t)<1e-4)return;return new Promise(r=>{v.addEventListener('seeked',r,{once:true});v.currentTime=t})}));
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))};
window.ready=Promise.all([...document.querySelectorAll('video')].map(v=>v.readyState>=2?1:new Promise(r=>v.addEventListener('loadeddata',r,{once:true}))));
document.getAnimations().forEach(a=>a.pause());
</script></body></html>
